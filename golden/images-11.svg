<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 399 501">
  <!--
    Golden case: 원숭이 2컷 (inputs/images-11.jpg)

    원본은 얼굴이 화면을 꽉 채우는 클로즈업이다. 머리를 작게 그리고 어깨를 붙이면
    사람 흉상이 되어 밈이 죽는다.
    위 칸은 정색, 아래 칸은 놀리는 얼굴 — 놀림은 한쪽 눈 윙크 + 히죽 올라간 입 +
    아래에서 올라오는 손가락 세 가지가 같이 있어야 산다.
    원숭이로 읽히게 하는 것: 튀어나온 눈두덩, 넓적한 주둥이, 얼굴을 두른 털 뭉치.
    윤곽을 두 겹 동심원으로 그리면 과녁처럼 보인다 — 바깥은 털 삐침으로 깨고,
    안쪽 맨살은 닫지 않은 호로 그린다.

    자막 지움 영역: x 89-308 / y 195-232, x 256-355 / y 278-323, x 125-280 / y 449-488.
    아래 칸 얼굴을 왼쪽으로 밀어 "꺄☆핫" 자리를 비워 둔다.
  -->

  <!-- ═══════════ 위 칸: 정색 ═══════════ -->
  <g fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 털 실루엣 -->
    <path d="M110 96 C106 44 146 8 200 8 C256 8 294 44 291 98
             C288 148 260 188 200 190 C142 192 114 148 110 96 Z"/>
    <!-- 삐친 털 -->
    <path d="M124 56 L112 44"/>  <path d="M114 82 L100 76"/>
    <path d="M114 116 L100 118"/><path d="M126 146 L113 154"/>
    <path d="M150 174 L142 187"/><path d="M200 8 L200 -6"/>
    <path d="M160 18 L154 4"/>   <path d="M242 18 L248 4"/>
    <path d="M276 56 L288 44"/>  <path d="M286 84 L300 78"/>
    <path d="M286 118 L300 120"/><path d="M274 148 L287 156"/>
    <path d="M250 174 L258 187"/>

    <!-- 맨살 얼굴: 닫지 않은 호 -->
    <path d="M144 106 C140 60 168 32 200 32 C234 32 262 60 258 106"/>

    <!-- 튀어나온 눈두덩 -->
    <path d="M154 64 C163 44 189 42 197 60"/>
    <path d="M207 59 C215 41 241 42 250 62"/>
    <!-- 미간 주름 -->
    <path d="M201 46 L201 62"/>

    <!-- 넓적한 주둥이 -->
    <path d="M162 110 C166 90 184 84 201 84 C219 84 238 90 241 112
             C244 136 227 154 201 154 C175 154 159 132 162 110 Z"/>
    <path d="M191 102 C193 110 196 110 198 102"/>
    <path d="M207 102 C209 110 212 110 214 102"/>
    <!-- 아래로 처진 입 -->
    <path d="M175 132 C187 125 215 125 227 133"/>
  </g>
  <g fill="#141414" stroke="none">
    <ellipse cx="175" cy="68" rx="9" ry="10"/>
    <ellipse cx="228" cy="66" rx="9" ry="10"/>
    <!-- 원본의 말줄임 -->
    <circle cx="316" cy="42" r="5"/>
    <circle cx="333" cy="42" r="5"/>
    <circle cx="350" cy="42" r="5"/>
  </g>

  <!-- ═══════════ 아래 칸: 놀리는 얼굴 ═══════════ -->
  <g fill="none" stroke="#141414" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- 털 실루엣: "꺄☆핫" 자리를 피해 왼쪽으로 -->
    <path d="M99 344 C96 296 132 262 176 262 C222 262 252 296 250 346
             C248 396 222 432 174 434 C126 436 102 394 99 344 Z"/>
    <!-- 삐친 털 -->
    <path d="M111 306 L98 298"/>  <path d="M100 338 L86 338"/>
    <path d="M105 372 L92 378"/>  <path d="M124 410 L114 421"/>
    <path d="M140 276 L134 262"/> <path d="M176 262 L176 248"/>
    <path d="M214 276 L220 262"/> <path d="M240 306 L253 298"/>
    <path d="M249 340 L262 340"/> <path d="M244 374 L256 380"/>
    <path d="M224 410 L233 421"/>

    <!-- 맨살 얼굴 -->
    <path d="M128 352 C125 310 148 284 176 284 C206 284 230 310 227 352"/>

    <!-- 왼눈: 찡긋 감았다 -->
    <path d="M136 312 C149 300 170 302 179 314"/>
    <path d="M142 322 C153 315 169 316 176 324"/>
    <!-- 눈가 웃음 주름 -->
    <path d="M132 330 L121 337"/>
    <path d="M136 340 L126 350"/>

    <!-- 오른눈: 뜨고 쳐다본다 -->
    <path d="M190 306 C199 294 219 295 227 308"/>

    <!-- 넓적한 주둥이 -->
    <path d="M141 356 C144 336 162 330 178 330 C195 330 212 338 214 360
             C217 384 199 400 176 400 C152 400 138 378 141 356 Z"/>
    <path d="M167 350 C169 358 172 358 174 350"/>
    <path d="M183 350 C185 358 188 358 190 350"/>
    <!-- 히죽 올라간 입 -->
    <path d="M150 376 C163 391 191 389 202 373"/>
    <!-- 히죽거리는 볼 주름 -->
    <path d="M145 344 C139 352 137 362 139 372"/>
    <path d="M212 344 C218 352 220 362 218 372"/>

    <!-- 아래에서 올라오는 손가락 -->
    <path d="M186 400 C190 414 196 426 204 434"/>
    <path d="M204 434 C213 439 222 434 221 424 C220 412 208 400 194 394"/>
  </g>
  <g fill="#141414" stroke="none">
    <ellipse cx="208" cy="313" rx="9" ry="10"/>
  </g>
</svg>
