<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 399 501">
  <!--
    Golden case: 원숭이 2컷 (inputs/images-11.jpg)
    The current pipeline fails here entirely — Vision finds no human face, so the
    result is a featureless blob. A model that understands "정색한 원숭이 / 코 후비며
    웃는 원숭이" can draw the joke; edge detection cannot.
    Picture only. Caption strips (y≈195-225, y≈455-485) are left empty.
  -->

  <!-- ================= 위 칸: 정색 ================= -->
  <g fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 머리 -->
    <path d="M163 62 C160 24 182 6 208 7 C235 8 254 28 252 64
             C250 96 234 116 207 117 C181 118 165 96 163 62 Z"/>
    <!-- 귀 -->
    <path d="M164 54 C152 48 145 58 149 70 C152 79 159 82 165 79"/>
    <path d="M252 56 C264 50 271 61 266 73 C263 81 256 84 250 80"/>
    <!-- 눈두덩 (정색의 핵심) -->
    <path d="M176 40 C186 32 199 32 207 38"/>
    <path d="M212 37 C221 31 234 32 242 40"/>
    <!-- 주둥이 -->
    <path d="M182 78 C184 62 199 56 210 57 C224 58 234 68 233 82
             C232 96 220 104 206 103 C191 102 181 92 182 78 Z"/>
    <!-- 콧구멍과 다문 입 -->
    <path d="M199 74 C201 79 203 79 205 74"/>
    <path d="M212 73 C214 78 216 78 218 73"/>
    <path d="M192 90 C202 95 216 95 224 89"/>
    <!-- 어깨: 가슴 안쪽은 자막 자리라 비운다 -->
    <path d="M92 195 C99 158 122 132 165 116"/>
    <path d="M250 116 C292 131 312 158 318 195"/>
  </g>
  <g fill="#141414" stroke="none">
    <ellipse cx="191" cy="46" rx="5" ry="5.5"/>
    <ellipse cx="226" cy="45" rx="5" ry="5.5"/>
    <!-- 원본의 "..." 말줄임 -->
    <circle cx="262" cy="33" r="3.5"/>
    <circle cx="274" cy="33" r="3.5"/>
    <circle cx="286" cy="33" r="3.5"/>
  </g>

  <!-- ================= 아래 칸: 코 후비며 웃음 ================= -->
  <g fill="none" stroke="#141414" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <!-- 머리 -->
    <path d="M162 305 C159 267 181 249 207 250 C234 251 253 271 251 307
             C249 339 233 359 206 360 C180 361 164 339 162 305 Z"/>
    <!-- 귀 -->
    <path d="M163 297 C151 291 144 301 148 313 C151 322 158 325 164 322"/>
    <path d="M251 299 C263 293 270 304 265 316 C262 324 255 327 249 323"/>
    <!-- 웃는 눈: 반달 -->
    <path d="M176 291 C184 281 197 281 205 290"/>
    <path d="M213 289 C221 279 234 279 242 288"/>
    <!-- 주둥이 -->
    <path d="M181 321 C183 305 198 299 209 300 C223 301 233 311 232 325
             C231 339 219 347 205 346 C190 345 180 335 181 321 Z"/>
    <!-- 히죽 웃는 입 -->
    <path d="M189 330 C200 341 218 340 226 328"/>
    <!-- 코를 후비는 손 -->
    <path d="M206 316 C205 330 200 344 191 356 C182 368 172 374 163 372"/>
    <path d="M163 372 C154 370 150 380 157 388 C166 398 184 396 196 384
             C208 372 214 352 212 336"/>
    <!-- 팔 -->
    <path d="M157 388 C143 398 132 414 126 434"/>
    <!-- 어깨 -->
    <path d="M88 455 C96 416 118 386 160 366"/>
    <path d="M250 360 C296 380 316 414 322 455"/>
