<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 225 225">
  <!--
    Golden case: 플랑크톤과 지갑 (inputs/images-9.jpg)

    농담: 거대한 지갑을 열어 안을 들여다봤는데 비어 있다. 반드시 읽혀야 하는 것 —
      (1) 지갑이 열려 있다  (2) 플랑크톤이 그 안을 들여다본다  (3) 지갑이 터무니없이 크다
    (1)은 두 면이 위에서 벌어진 틈으로, (2)는 눈이 그 틈을 향하게 해서 만든다.

    자막 지움 영역: x 96-127 / y 170-191, x 57-166 / y 185-210. 그림은 그 위로 뺀다.
  -->

  <g fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">

    <!-- ── 지갑 뒷면 (P가 박힌 큰 면) ── -->
    <path d="M138 26 C164 20 188 24 199 32 C204 36 205 50 204 86
             C203 122 202 142 197 150 C186 160 164 163 146 158"/>
    <!-- 아래쪽으로 돌아 나오는 바닥 -->
    <path d="M146 158 C138 154 132 146 130 136"/>
    <!-- 반으로 접히는 자국 -->
    <path d="M136 92 C158 88 182 88 203 92"/>

    <!-- ── 지갑 앞면: 이쪽으로 젖혀져 열려 있다 ── -->
    <path d="M124 52 C114 64 110 82 110 102 C110 126 116 144 128 154
             C133 158 139 159 146 158"/>
    <!-- 벌어진 아가리: 두 면의 위쪽 테두리가 만나지 않고 V로 벌어진다 -->
    <path d="M138 26 C132 34 128 43 124 52"/>
    <!-- 아가리 안쪽 어둠 (P와 겹치지 않게 짧게) -->
    <path d="M128 50 C137 57 145 61 152 62"/>
    <path d="M133 41 C142 48 150 52 157 53"/>
  </g>

  <!-- 가죽 박음질 -->
  <g fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 8">
    <path d="M141 32 C165 27 185 30 194 37 C198 41 199 52 198 86
             C197 120 196 138 192 145 C182 154 163 157 148 153"/>
    <path d="M123 60 C116 72 113 85 113 102 C113 124 119 139 128 148"/>
  </g>

  <!-- 지갑에 눌러 박은 P -->
  <g fill="none" stroke="#141414" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M158 56 L156 84"/>
    <path d="M158 56 C176 55 183 62 181 70 C179 78 169 80 157 79"/>
  </g>

  <!-- ── 플랑크톤: 지갑 쪽으로 몸을 기울여 안을 본다 ── -->
  <g fill="none" stroke="#141414" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 콩 모양 몸통 -->
    <path d="M66 70 C48 76 36 94 35 116 C34 138 46 154 66 156
             C84 158 94 146 94 128 C94 110 88 92 82 80"/>
    <!-- 뒤로 넘어간 더듬이 -->
    <path d="M68 68 C56 54 42 44 26 38"/>
    <path d="M80 70 C74 52 64 38 50 28"/>
    <path d="M58 58 L54 50"/>
    <path d="M44 48 L40 40"/>
    <path d="M74 56 L70 48"/>
    <path d="M64 42 L60 34"/>
    <!-- 지갑 아가리를 두 손으로 붙잡았다 (테두리를 넘어간다) -->
    <path d="M90 92 C102 84 112 78 122 74"/>
    <path d="M92 122 C102 122 110 124 118 130"/>
    <!-- 두 다리: 자막 위에서 끊는다 -->
    <path d="M52 156 C50 162 49 167 47 168"/>
    <path d="M74 156 C76 162 78 167 80 168"/>
  </g>

  <!-- 벌어진 틈을 올려다보는 외눈 -->
  <g fill="none" stroke="#141414" stroke-width="4.5" stroke-linejoin="round">
    <ellipse cx="74" cy="80" rx="15" ry="13"/>
  </g>
  <g fill="#141414" stroke="none">
    <ellipse cx="82" cy="76" rx="6" ry="6.5"/>
  </g>

  <!-- 벌어진 입 -->
  <g fill="none" stroke="#141414" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 100 C75 106 82 105 85 99"/>
  </g>
</svg>
