<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 638 480">
  <!--
    Golden case: "거지왕 강림" (inputs/images-3.jpg)
    Hand-authored target for the LLM-SVG renderer. Picture only — no text.
    Style: one thick wobbly stroke per shape, blank stare, chest left empty so
    the caption layer has somewhere to sit.
  -->
  <g fill="none" stroke="#141414" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">

    <!-- 머리 윤곽: 오른쪽 위를 올려다보느라 살짝 기운 달걀형 -->
