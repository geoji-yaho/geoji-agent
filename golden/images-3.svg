             C224 231 218 205 216 182 Z"/>

    <!-- 앞머리: 이마를 덮고 관자놀이까지 내려오는 한 덩어리 -->
    <path d="M217 186 C211 112 252 57 305 54 C361 51 389 92 388 152
             C368 122 338 108 305 118 C275 127 240 152 217 186 Z"/>

    <!-- 귀 (왼쪽만 살짝) -->
